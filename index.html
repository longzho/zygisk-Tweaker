<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Redirect</title>
  <script>
    // 检测用户浏览器的语言
    const userLang = navigator.language || navigator.userLanguage;
    if (userLang.startsWith('zh')) {
      window.location.href = 'README.zh.html'; // 跳转到中文页面
    } else {
      window.location.href = 'README.en.html'; // 跳转到英文页面
    }
  </script>
</head>
<body>
  <p>Redirecting based on your language...</p>
</body>
</html>
